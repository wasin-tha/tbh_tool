name: Update Steam Prices

on:
  # schedule ใช้ cron-job.org ยิง workflow_dispatch แทน (ตรงเวลากว่า GitHub cron)
  # เพิ่ม GitHub schedule กลับได้: ใส่ schedule: - cron: '37 * * * *'
  workflow_dispatch:          # cron-job.org + กดรันเองจากแท็บ Actions

permissions:
  contents: write
  actions: read      # ให้เช็คผล run ก่อนหน้าได้ (เงื่อนไข Discord 4 ครั้งติด)

concurrency:
  group: update-prices
  cancel-in-progress: false

# ★ กลับมารัน GitHub-hosted (2026-07-12) — fetch เป็น anon ผ่าน curl แล้ว ไม่ต้อง login:
#   ที่เคยสรุปว่า "Steam บล็อก IP datacenter" จริงๆ คือ Steam กรอง TLS fingerprint ของ Python
#   (curl ผ่านตลอด — ทดสอบยิง 20 หน้าติดจาก ubuntu-latest แล้ว 200 ทั้งหมด)
#   anon จาก IP US ได้ราคา $ → fetch_prices.py แปลงเป็น ฿ ด้วยเรตตลาด (คลาด ≤3%)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # ไม่มี dependency แล้ว — fetch ใช้ curl (มีในเครื่อง) + stdlib เท่านั้น

      - name: Fetch Steam Market prices (anon, parallel)
        run: python3 fetch_prices.py --reset

      - name: Rebuild index.html + prices.json
        run: python3 gen_tbh.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html prices.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update Steam Market prices (auto)"
          for i in 1 2 3; do
            # rebase บน remote ก่อน push (กัน "fetch first" ตอน remote ขยับ)
            if git pull --rebase origin main && git push; then exit 0; fi
            echo "push retry $i..."
            sleep 4
          done
          exit 1

      - name: Notify Discord on 4 consecutive failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # ส่ง Discord เฉพาะเมื่อพัง 4 ครั้งติด — รอบเดียว/สองพังชั่วคราว (rate limit) ไม่ต้องเตือน
          # current run ยังไม่ completed → 3 run ที่ completed ล่าสุด = 3 รอบก่อนหน้า
          # นับ "ไม่ success" (failure+cancelled) — กัน run ที่โดน cancel รีเซ็ตตัวนับ
          bad=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-prices.yml/runs?status=completed&per_page=3" \
            | jq '[.workflow_runs[] | select(.conclusion != "success")] | length')
          echo "previous 3 completed runs not-success: $bad/3"
          if [ "${bad:-0}" -lt 3 ]; then echo "ยังไม่ครบ 4 ครั้งติด — เงียบไว้ก่อน"; exit 0; fi
          jq -n --arg c "⚠️ **TBH price update ล้มเหลว 4 ครั้งติด** (GitHub-hosted)
          สาเหตุที่พบบ่อย: Steam rate limit / เรตแปลง USD→THB ดึงไม่ได้ / build error
          🔗 ดู log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{content:$c}' | curl -s -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
